<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Assignment Submission</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background-color: #f6f8fa;
      text-align: center;
      padding-top: 100px;
    }
    .container {
      background: white;
      padding: 50px;
      width: 400px;
      margin: auto;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    button {
      background: #0078ff;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #005fcc;
    }
    .message {
      margin-top: 20px;
      font-size: 15px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Assignment Automation</h2>
    <p>Click below to auto-fill the form and send the submission email.</p>
    <form action="/send" method="post">
      <button type="submit">🚀 Send Assignment</button>
    </form>
    {% if message %}
      <p class="message">{{ message }}</p>
    {% endif %}
  </div>
</body>
</html>
